<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">磁场偏转、板间反射与两个极值路径</title>
  <desc id="desc">左图展示粒子由 P 经 Q 进入板间、反射返回 Q 后在磁场中走半圆落到 7L；右图展示另一条斜向过孔轨迹返回 M 板下表面，水平位移为根号三 d。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0L9 3.5L0 7Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0L9 3.5L0 7Z" fill="#f97316"/>
    </marker>
    <pattern id="field-crosses" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M12 12l8 8m0-8l-8 8" stroke="#93c5fd" stroke-width="1.8"/>
    </pattern>
  </defs>
  <rect width="960" height="470" rx="20" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0f172a">不能停在第一次落板：必须跟踪粒子返回 Q 后的运动</text>

  <g aria-label="选项 C 路径">
    <rect x="26" y="52" width="442" height="384" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="42" y="88" width="410" height="220" fill="url(#field-crosses)"/>
    <text x="46" y="78" font-family="sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">C：竖直过孔 → 反射 → 返回磁场</text>
    <text x="420" y="104" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2563eb">B ⊗</text>

    <line x1="46" y1="308" x2="446" y2="308" stroke="#334155" stroke-width="8"/>
    <line x1="46" y1="392" x2="446" y2="392" stroke="#64748b" stroke-width="8"/>
    <rect x="210" y="302" width="18" height="12" fill="#eff6ff"/>
    <text x="51" y="299" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">M</text>
    <text x="51" y="383" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">N</text>
    <text x="218" y="329" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Q</text>
    <text x="76" y="329" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">O</text>

    <circle cx="76" cy="168" r="5" fill="#dc2626"/>
    <text x="63" y="158" font-family="sans-serif" font-size="15" font-weight="700" fill="#991b1b">P</text>
    <path d="M76 168C112 82 205 152 219 307" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M219 310L219 374" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <path d="M225 374L225 314" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <path d="M228 306A96 96 0 0 1 420 306" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <circle cx="420" cy="307" r="6" fill="#dc2626"/>
    <text x="420" y="331" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">距 O 为 7L</text>
    <line x1="76" y1="350" x2="219" y2="350" stroke="#64748b" stroke-width="1.8"/>
    <line x1="76" y1="343" x2="76" y2="357" stroke="#64748b" stroke-width="1.8"/>
    <line x1="219" y1="343" x2="219" y2="357" stroke="#64748b" stroke-width="1.8"/>
    <text x="147" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">OQ = 3L</text>
    <text x="315" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1d4ed8">返回 Q 后半圆半径仍为 2L</text>
  </g>

  <g aria-label="选项 D 路径">
    <rect x="492" y="52" width="442" height="384" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="508" y="88" width="410" height="220" fill="url(#field-crosses)"/>
    <text x="512" y="78" font-family="sans-serif" font-size="16" font-weight="700" fill="#c2410c">D：另一条过 P、Q 的圆轨迹</text>
    <text x="886" y="104" text-anchor="end" font-family="sans-serif" font-size="13" fill="#2563eb">B ⊗</text>

    <line x1="512" y1="308" x2="912" y2="308" stroke="#334155" stroke-width="8"/>
    <line x1="512" y1="392" x2="912" y2="392" stroke="#64748b" stroke-width="8"/>
    <rect x="734" y="302" width="18" height="12" fill="#fff7ed"/>
    <text x="517" y="299" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">M</text>
    <text x="517" y="383" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">N</text>
    <text x="743" y="329" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Q</text>

    <circle cx="542" cy="168" r="5" fill="#dc2626"/>
    <text x="529" y="158" font-family="sans-serif" font-size="15" font-weight="700" fill="#991b1b">P</text>
    <path d="M542 168C542 88 707 112 743 307" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M743 311C717 366 667 369 628 309" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <circle cx="628" cy="307" r="6" fill="#dc2626"/>
    <line x1="628" y1="350" x2="743" y2="350" stroke="#64748b" stroke-width="1.8"/>
    <line x1="628" y1="343" x2="628" y2="357" stroke="#64748b" stroke-width="1.8"/>
    <line x1="743" y1="343" x2="743" y2="357" stroke="#64748b" stroke-width="1.8"/>
    <text x="685" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#c2410c">√3 d</text>
    <text x="686" y="407" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">斜入射分支命中 M 板下表面</text>
  </g>
</svg>
