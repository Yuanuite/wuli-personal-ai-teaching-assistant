<script>
(() => {
  const root=document.getElementById('piecewise-particle-2d');
  const model=JSON.parse(root.querySelector('#piecewise-particle-model').textContent);
  const canvas=root.querySelector('#canvas-piecewise'),ctx=canvas.getContext('2d');
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=d=>d*Math.PI/180;
  const palette=['#2783c4','#c87821','#348c50','#a53b78','#d6531d','#6d5bd0'];
  const particles=model.facts.particles||[],particleById=new Map(particles.map((p,i)=>[p.id,{...p,color:p.color||palette[i%palette.length]}]));
  const cases=model.event_model.cases||[],timeline=[...model.event_model.timeline].sort((a,b)=>a.time-b.time);
  const allSegments=model.trajectory.segments||[],pauseIds=new Set(model.simulation.pause_event_ids||[]);
  const viewport=model.facts.viewport;
  let caseId=cases[0].id,progress=0,playing=false,lastTime=0,lastPause=-1,layer=model.simulation.default_layer||'trajectory';
  let zoom=1,panX=0,panY=0,drag=null,viewScale=1;
  const pointers=new Map();
  const colors=()=>{const s=getComputedStyle(root),v=n=>s.getPropertyValue(n).trim();return{bg:v('--background')||'#fff',fg:v('--foreground')||'#222',muted:v('--muted-foreground')||'#667',border:v('--border')||'#bbb',one:v('--viz-series-1')||'#2783c4',two:v('--viz-series-2')||'#c87821',force:v('--viz-series-4')||'#a53b78',particle:v('--destructive')||'#d6531d'}};
  const px=value=>value/(viewScale*zoom);
  const currentCase=()=>cases.find(item=>item.id===caseId)||cases[0];
  const segments=()=>allSegments.filter(segment=>(segment.case_ids||[]).includes(caseId));
  const events=()=>timeline.filter(event=>!event.case_ids||(event.case_ids||[]).includes(caseId));
  const totalTime=()=>Math.max(...events().map(event=>Number(event.time)),...segments().map(segment=>Number(segment.kinematics.end_time)));

  function sample(segment,samples=120){
    const g=segment.geometry;
    if(segment.type==='line')return [g.start,g.end].map(point=>({x:point[0],y:point[1]}));
    if(segment.type==='polyline')return g.points.map(point=>({x:point[0],y:point[1]}));
    if(segment.type==='parabola'){const pl=segment.geometry;const pts=[];for(let i=0;i<samples;i++){const t=(i/(samples-1))*(pl.duration||1);pts.push({x:pl.start[0]+pl.velocity[0]*t+0.5*pl.acceleration[0]*t*t,y:pl.start[1]+pl.velocity[1]*t+0.5*pl.acceleration[1]*t*t})}return pts}
    const points=[],start=rad(g.start_deg),end=rad(g.end_deg);
    for(let i=0;i<samples;i++){const f=i/(samples-1),a=start+(end-start)*f;points.push({x:g.center[0]+g.radius*Math.cos(a),y:g.center[1]+g.radius*Math.sin(a)})}
    return points;
  }
  for(const segment of allSegments)segment.points=sample(segment);
  function segmentFraction(segment,time){const k=segment.kinematics;return clamp((time-k.start_time)/(k.end_time-k.start_time),0,1)}
  function pointOn(segment,f){
    const points=segment.points,index=clamp(Math.round((points.length-1)*f),0,points.length-1),a=points[Math.max(0,index-1)],b=points[Math.min(points.length-1,index+1)],length=Math.hypot(b.x-a.x,b.y-a.y)||1;
    return{point:points[index],tangent:{x:(b.x-a.x)/length,y:(b.y-a.y)/length},segment};
  }
  function particleState(particleId,time){
    const owned=segments().filter(segment=>segment.particle_id===particleId).sort((a,b)=>a.kinematics.start_time-b.kinematics.start_time);
    if(!owned.length)return null;
    let chosen=owned[0],fraction=0;
    for(const segment of owned){chosen=segment;fraction=segmentFraction(segment,time);if(time<=segment.kinematics.end_time+1e-8)break;fraction=1}
    return pointOn(chosen,fraction);
  }
  function metrics(){const w=Math.max(320,Math.round(canvas.getBoundingClientRect().width)),h=Math.round(w*10/16),d=devicePixelRatio||1;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);return{w,h}}

  function stroke(points,color,width,f=1,dash=[]){if(!points.length)return;const n=Math.max(2,Math.ceil(points.length*f));ctx.strokeStyle=color;ctx.lineWidth=px(width);ctx.setLineDash(dash.map(px));ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<Math.min(n,points.length);i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.setLineDash([])}
  function arrow(a,b,color,text=''){const angle=Math.atan2(b.y-a.y,b.x-a.x),head=px(7);ctx.strokeStyle=ctx.fillStyle=color;ctx.lineWidth=px(2);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-head*Math.cos(angle-.45),b.y-head*Math.sin(angle-.45));ctx.lineTo(b.x-head*Math.cos(angle+.45),b.y-head*Math.sin(angle+.45));ctx.closePath();ctx.fill();if(text)label(text,b.x+px(6),b.y+px(7),color,'left')}
  function fieldSymbol(x,y,field,color){const kind=field.kind;ctx.strokeStyle=ctx.fillStyle=color;ctx.lineWidth=px(1.2);if(kind==='magnetic-out'){ctx.beginPath();ctx.arc(x,y,px(4),0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,px(1.3),0,Math.PI*2);ctx.fill()}else if(kind==='magnetic-in'){ctx.beginPath();ctx.moveTo(x-px(3),y-px(3));ctx.lineTo(x+px(3),y+px(3));ctx.moveTo(x-px(3),y+px(3));ctx.lineTo(x+px(3),y-px(3));ctx.stroke()}else{const vector=field.vector||[1,0],length=Math.hypot(vector[0],vector[1])||1,dx=vector[0]/length*px(6),dy=vector[1]/length*px(6);arrow({x:x-dx,y:y-dy},{x:x+dx,y:y+dy},color,'')}}
  function drawShape(region,c){
    const s=region.shape,color=region.color||c.one;
    ctx.save();ctx.globalAlpha=.1;ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=px(1.5);
    if(s.type==='rect'){ctx.fillRect(s.x,s.y,s.width,s.height);ctx.globalAlpha=.7;ctx.strokeRect(s.x,s.y,s.width,s.height)}

    else if(s.type==='half-plane'){const x=s.side==='left'?viewport.xmin:s.x,y=viewport.ymin,w=s.side==='left'?s.x-viewport.xmin:viewport.xmax-s.x;ctx.fillRect(x,y,w,viewport.ymax-viewport.ymin);ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(s.x,viewport.ymin);ctx.lineTo(s.x,viewport.ymax);ctx.stroke()}

    ctx.restore();
    if(layer==='field'){
      const polygonContains=(points,x,y)=>{let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const xi=points[i][0],yi=points[i][1],xj=points[j][0],yj=points[j][1],cross=(yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi;if(cross)inside=!inside}return inside};
      const box=s.type==='rect'?{x0:s.x,x1:s.x+s.width,y0:s.y,y1:s.y+s.height}:s.type==='circle'?{x0:s.cx-s.r,x1:s.cx+s.r,y0:s.cy-s.r,y1:s.cy+s.r}:s.type==='polygon'?{x0:Math.min(...s.points.map(p=>p[0])),x1:Math.max(...s.points.map(p=>p[0])),y0:Math.min(...s.points.map(p=>p[1])),y1:Math.max(...s.points.map(p=>p[1]))}:s.side==='left'?{x0:viewport.xmin,x1:s.x,y0:viewport.ymin,y1:viewport.ymax}:{x0:s.x,x1:viewport.xmax,y0:viewport.ymin,y1:viewport.ymax};
      const contains=(x,y)=>s.type==='circle'?Math.hypot(x-s.cx,y-s.cy)<=s.r:s.type==='polygon'?polygonContains(s.points,x,y):true;

  }
  function drawGeometry(c){
    for(const segment of segments().filter(item=>item.type==='arc')){
      const g=segment.geometry;ctx.strokeStyle=particleById.get(segment.particle_id)?.color||c.muted;ctx.lineWidth=px(1);ctx.setLineDash([px(5),px(4)]);ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(g.center[0],g.center[1],g.radius,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;ctx.setLineDash([]);ctx.fillStyle=c.muted;ctx.beginPath();ctx.arc(g.center[0],g.center[1],px(3),0,Math.PI*2);ctx.fill();if(g.radius_label)label(g.radius_label,g.center[0],g.center[1]+.18,c.muted)}
  }
  function draw(){
    const m=metrics(),c=colors(),scale=Math.min((m.w-34)/(viewport.xmax-viewport.xmin),(m.h-34)/(viewport.ymax-viewport.ymin)),cx=(viewport.xmin+viewport.xmax)/2,cy=(viewport.ymin+viewport.ymax)/2,time=progress*totalTime();viewScale=scale;
    ctx.fillStyle=c.bg;ctx.fillRect(0,0,m.w,m.h);ctx.save();ctx.translate(m.w/2+panX,m.h/2+panY);ctx.scale(scale*zoom,-scale*zoom);ctx.translate(-cx,-cy);
    const pField=model.regions.find(r=>r.id==="plate-field");if(pField&&time>=1)pField.field.vector=((time-1)%1)<0.5?[0,1]:[0,-1];for(const region of model.regions)drawShape(region,c);
    for(const segment of segments()){const color=particleById.get(segment.particle_id)?.color||c.one;ctx.save();ctx.globalAlpha=.18;stroke(segment.points,color,1.4);ctx.restore();const f=segmentFraction(segment,time);if(f>0)stroke(segment.points,color,3.1,f)}
    if(layer==='geometry')drawGeometry(c);
    for(const particle of particles){const state=particleState(particle.id,time);if(!state)continue;const p=state.point,color=particleById.get(particle.id).color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,px(7),0,Math.PI*2);ctx.fill();label(particle.label||particle.id,p.x,p.y+px(16),color);if(layer==='field'){arrow(p,{x:p.x+state.tangent.x*px(34),y:p.y+state.tangent.y*px(34)},color,'v');const force=state.segment.force_direction;if(Array.isArray(force))arrow(p,{x:p.x+force[0]*px(30),y:p.y+force[1]*px(30)},c.force,'F')}}
    for(const event of events().filter(event=>Array.isArray(event.position))){const hot=event.id===model.event_model.stop_event_id;ctx.fillStyle=hot?c.force:c.muted;ctx.beginPath();ctx.arc(event.position[0],event.position[1],px(hot?5:3),0,Math.PI*2);ctx.fill();if(layer==='geometry'||hot)label(event.short_label||event.label,event.position[0],event.position[1]-.17,hot?c.force:c.muted)}
    ctx.restore();
    const event=[...events()].reverse().find(item=>time+1e-8>=item.time)||events()[0],active=segments().find(item=>time>=item.kinematics.start_time-1e-8&&time<=item.kinematics.end_time+1e-8)||segments().at(-1);
    root.querySelector('#phase-piecewise').textContent=active?.label||active?.id||'等待';root.querySelector('#event-piecewise').textContent=event?.label||'';root.querySelector('#result-piecewise').textContent=currentCase().conclusion||'';root.querySelector('#progress-piecewise').value=Math.round(progress*1000);root.querySelector('#progress-label-piecewise').textContent=`${Math.round(progress*100)}%`;root.querySelector('#duration-label-piecewise').textContent=`${root.querySelector('#duration-piecewise').value} 秒`;
  }
  function setPlaying(value){playing=value;lastTime=0;root.querySelector('#play-piecewise').textContent=value?'暂停':'播放'}
  function stops(){const max=totalTime();return events().filter(event=>pauseIds.has(event.id)).map(event=>event.time/max)}
  function jump(direction){const values=stops(),eps=.002,target=direction>0?values.find(x=>x>progress+eps):[...values].reverse().find(x=>x<progress-eps);if(target!==undefined){progress=target;lastPause=values.indexOf(target);setPlaying(false);draw()}}
  function animate(ts){if(playing){if(!lastTime)lastTime=ts;const old=progress;progress+=(ts-lastTime)/(Number(root.querySelector('#duration-piecewise').value)*1000);lastTime=ts;const values=stops();if(root.querySelector('#auto-pause-piecewise').checked){const hit=values.findIndex((x,i)=>i!==lastPause&&x>old+1e-5&&x<=progress);if(hit>=0){progress=values[hit];lastPause=hit;setPlaying(false)}}if(progress>=1){progress=1;setPlaying(false)}draw()}requestAnimationFrame(animate)}
  root.querySelector('#piecewise-title').textContent=model.title;
  const select=root.querySelector('#case-piecewise');for(const item of cases){const option=document.createElement('option');option.value=item.id;option.textContent=item.label||item.id;select.append(option)}select.onchange=()=>{caseId=select.value;progress=0;lastPause=-1;setPlaying(false);zoom=1;panX=panY=0;draw()};
  const duration=root.querySelector('#duration-piecewise');duration.value=String(model.simulation.default_duration_seconds);
  root.querySelectorAll('[data-layer]').forEach(button=>button.onclick=()=>{layer=button.dataset.layer;root.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('active',x===button));draw()});
  root.querySelector('#play-piecewise').onclick=()=>{if(progress>=1){progress=0;lastPause=-1}setPlaying(!playing);draw()};root.querySelector('#replay-piecewise').onclick=()=>{progress=0;lastPause=-1;setPlaying(true);draw()};root.querySelector('#progress-piecewise').oninput=e=>{progress=Number(e.target.value)/1000;lastPause=-1;setPlaying(false);draw()};duration.oninput=draw;root.querySelector('#previous-event-piecewise').onclick=()=>jump(-1);root.querySelector('#next-event-piecewise').onclick=()=>jump(1);root.querySelector('#zoom-in-piecewise').onclick=()=>{zoom=clamp(zoom*1.22,.55,4);draw()};root.querySelector('#zoom-out-piecewise').onclick=()=>{zoom=clamp(zoom/1.22,.55,4);draw()};root.querySelector('#fit-piecewise').onclick=()=>{zoom=1;panX=panY=0;draw()};
  canvas.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.12:.89),.55,4);draw()};canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,panX,panY}};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){panX=drag.panX+e.clientX-drag.x;panY=drag.panY+e.clientY-drag.y;draw()}};const end=e=>{pointers.delete(e.pointerId);drag=null};canvas.onpointerup=end;canvas.onpointercancel=end;
  const more=root.querySelector('.more-controls');if(window.matchMedia('(min-width:761px)').matches)more.open=true;
  draw();new ResizeObserver(draw).observe(root);requestAnimationFrame(animate);
})();
