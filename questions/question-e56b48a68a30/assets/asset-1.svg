<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="sans-serif">
  <!-- This SVG uses only basic SVG elements (rect, circle, line, path, text)
       for universal compatibility. No filters, no 3D perspective. -->

  <!-- Arrow markers (defined first for universal renderer compatibility) -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#fafafa" rx="6"/>

  <!-- ==================== TITLE ==================== -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">三区域复合场粒子运动示意图</text>
  <text x="450" y="48" text-anchor="middle" font-size="10" fill="#64748b">区域 I（辐向电场）→ 区域 II（匀强电场 E₂）→ 区域 III（匀强磁场 B，纯圆周运动）</text>

  <!-- ================================================================ -->
  <!-- REGION I: Radial Electric Field                                -->
  <!-- ================================================================ -->
  <rect x="20" y="65" width="270" height="240" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="65" width="270" height="28" rx="6" fill="#2563eb" opacity="0.12"/>
  <text x="155" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">区域 I：辐向电场</text>

  <!-- Arc trajectory O' → O (radius R) -->
  <!-- Center O₁ at (134, 188), arc of radius 80 from O' to O -->
  <path d="M 190,128 A 80,80 0 0,1 134,268" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <!-- Small direction arrows along arc -->
  <polygon points="195,138 188,134 197,132" fill="#2563eb"/>
  <polygon points="178,170 171,167 179,164" fill="#2563eb"/>
  <polygon points="158,200 151,198 158,195" fill="#2563eb"/>
  <polygon points="140,235 134,233 140,230" fill="#2563eb"/>

  <!-- Center O₁ -->
  <circle cx="134" cy="188" r="4" fill="#1e40af"/>
  <text x="124" y="204" text-anchor="end" font-size="11" fill="#1e40af" font-weight="bold">O₁</text>

  <!-- Radial dashed line showing R -->
  <line x1="134" y1="188" x2="190" y2="128" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="168" y="148" font-size="10" fill="#64748b">R</text>

  <!-- Entrance O' -->
  <circle cx="190" cy="128" r="4" fill="#2563eb"/>
  <text x="200" y="125" font-size="11" fill="#2563eb" font-weight="bold">O′</text>
  <!-- Entry velocity -->
  <line x1="190" y1="128" x2="174" y2="114" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <!-- Exit O -->
  <circle cx="134" cy="268" r="4" fill="#2563eb"/>
  <text x="114" y="280" text-anchor="end" font-size="11" fill="#2563eb" font-weight="bold">O</text>
  <!-- Exit velocity (+x) -->
  <line x1="134" y1="268" x2="166" y2="268" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowB)"/>

  <!-- Force arrows pointing toward O₁ -->
  <line x1="178" y1="148" x2="162" y2="166" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="178" y1="193" x2="160" y2="191" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="155" y1="242" x2="145" y2="222" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <text x="198" y="150" font-size="9" fill="#dc2626" font-weight="bold">F₁ = qE₁</text>
  <text x="198" y="162" font-size="8" fill="#dc2626">指向 O₁（径向向内）</text>

  <!-- Formula -->
  <text x="155" y="300" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="bold">qE₁ = mv²/R（电场力=向心力）</text>
  <text x="155" y="314" text-anchor="middle" font-size="10" fill="#1e40af">→ q/m = v²/(E₁R)</text>
  <text x="155" y="330" text-anchor="middle" font-size="9" fill="#64748b">轨迹：沿半径 R 的圆弧，等速率</text>

  <!-- ================================================================ -->
  <!-- ARROW between Region I and II                                  -->
  <!-- ================================================================ -->
  <line x1="290" y1="185" x2="318" y2="185" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="304" y="178" text-anchor="middle" font-size="8" fill="#94a3b8">O→+x→</text>

  <!-- ================================================================ -->
  <!-- REGION II: Uniform Electric Field                              -->
  <!-- ================================================================ -->
  <rect x="325" y="65" width="260" height="240" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="325" y="65" width="260" height="28" rx="6" fill="#d97706" opacity="0.12"/>
  <text x="455" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">区域 II：匀强电场 E₂（类平抛）</text>

  <!-- Cube outline -->
  <rect x="340" y="115" width="230" height="175" fill="none" stroke="#d97706" stroke-width="1.5" rx="2" stroke-dasharray="5,3"/>
  <text x="565" y="160" font-size="8" fill="#92400e">L</text>
  <text x="340" y="108" font-size="8" fill="#92400e">L</text>

  <!-- Parabolic trajectory O → P -->
  <path d="M 340,270 C 420,270 500,240 570,200" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <!-- Entry O -->
  <circle cx="340" cy="270" r="3.5" fill="#16a34a"/>
  <text x="330" y="284" text-anchor="end" font-size="9" fill="#16a34a">O（入口）</text>

  <!-- Exit P -->
  <circle cx="570" cy="200" r="3.5" fill="#16a34a"/>
  <text x="578" y="196" font-size="9" fill="#16a34a" font-weight="bold">P（出口）</text>
  <text x="578" y="208" font-size="8" fill="#64748b">(L, L/2, 0)</text>

  <!-- E₂ arrow (upward) -->
  <line x1="510" y1="280" x2="510" y2="145" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="518" y="150" font-size="10" fill="#92400e" font-weight="bold">E₂（+y）</text>

  <!-- Formulas -->
  <text x="455" y="310" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">x = vt（匀速），y = ½·(qE₂/m)·t²</text>
  <text x="455" y="324" text-anchor="middle" font-size="9" fill="#1e293b">代入 v² = qE₁R/m → y = E₂L²/(2E₁R)</text>
  <text x="455" y="338" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="bold">关键：y 与 q/m 无关！所有粒子出口同为 P</text>

  <!-- ================================================================ -->
  <!-- ARROW between Region II and III                                -->
  <!-- ================================================================ -->
  <line x1="585" y1="200" x2="608" y2="195" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="602" y="190" font-size="8" fill="#94a3b8">→III</text>

  <!-- ================================================================ -->
  <!-- REGION III: Uniform Magnetic Field                             -->
  <!-- ================================================================ -->
  <rect x="615" y="65" width="268" height="240" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="615" y="65" width="268" height="28" rx="6" fill="#15803d" opacity="0.12"/>
  <text x="749" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">区域 III：匀强磁场 B 中的纯圆周运动</text>

  <!-- (e₁,z) motion plane diagram -->
  <!-- Simplified: show the circular trajectory in cross-section -->

  <!-- Top face: collector plate z = L -->
  <line x1="635" y1="120" x2="863" y2="120" stroke="#15803d" stroke-width="2.5"/>
  <polygon points="860,116 870,120 860,124" fill="#15803d"/>
  <text x="749" y="112" text-anchor="middle" font-size="10" fill="#166534" font-weight="bold">收集板（z = L）</text>

  <!-- Bottom surface z = 0 -->
  <line x1="635" y1="290" x2="863" y2="290" stroke="#15803d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="868" y="293" font-size="8" fill="#64748b">z = 0（底面）</text>

  <!-- Side edges -->
  <line x1="635" y1="120" x2="635" y2="290" stroke="#15803d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="863" y1="120" x2="863" y2="290" stroke="#15803d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Motion axis e₁ -->
  <line x1="635" y1="290" x2="863" y2="160" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="680" y="210" font-size="7" fill="#94a3b8">e₁ 方向</text>

  <!-- Full reference circle (dashed) — the correct trajectory boundary -->
  <!-- Center C at (749, 205), radius r_px = 85 -->
  <circle cx="749" cy="205" r="85" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Center C -->
  <circle cx="749" cy="205" r="4" fill="#7c3aed"/>
  <text x="756" y="200" font-size="10" fill="#7c3aed" font-weight="bold">C（圆心）</text>

  <!-- Radius line -->
  <line x1="749" y1="205" x2="749" y2="290" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="756" y="252" font-size="9" fill="#7c3aed">r</text>

  <!-- Trajectory arc: follows the right side of the dashed circle from P to top -->
  <path d="M 749,290 A 85,85 0 0,0 749,120" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <!-- Direction arrow along the arc -->
  <polygon points="805,270 798,276 796,267" fill="#7c3aed"/>
  <polygon points="828,240 822,248 819,239" fill="#7c3aed"/>

  <!-- Entry point P (bottom, z=0) -->
  <circle cx="749" cy="290" r="5" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <text x="735" y="312" text-anchor="end" font-size="9" fill="#7c3aed" font-weight="bold">P（入口，z=0，最低点）</text>

  <!-- Hit point: particle reaches collector plate at top of the dashed circle -->
  <circle cx="749" cy="120" r="4.5" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <text x="758" y="102" font-size="9" fill="#7c3aed" font-weight="bold">击中收集板</text>

  <!-- B field symbol: ⊙ (out of page) -->
  <circle cx="780" cy="230" r="10" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <circle cx="780" cy="230" r="2.5" fill="#16a34a"/>
  <text x="794" y="227" font-size="10" fill="#16a34a" font-weight="bold">B ⊙</text>
  <text x="794" y="240" font-size="8" fill="#16a34a">垂直纸面向外</text>
  <text x="794" y="252" font-size="7" fill="#64748b">B∥xOy，沿(−1,1,0)/√2</text>

  <!-- Velocity at P: horizontal (tangent to circle at lowest point) -->
  <line x1="749" y1="290" x2="830" y2="290" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <text x="835" y="286" font-size="8" fill="#2563eb">v=(v,v,0)</text>
  <text x="835" y="298" font-size="7" fill="#64748b">v⊥B → 纯圆周</text>

  <!-- Lorentz force at P -->
  <line x1="749" y1="290" x2="749" y2="248" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="754" y="246" font-size="8" fill="#dc2626" font-weight="bold">F=qv×B</text>

  <!-- ωt = π/2 point (rightmost point of the circle) -->
  <circle cx="834" cy="205" r="3" fill="#f59e0b"/>
  <text x="840" y="202" font-size="8" fill="#f59e0b">ωt=π/2（y 最大）</text>

  <!-- Constraints -->
  <text x="749" y="328" text-anchor="middle" font-size="9" fill="#1e293b">运动平面 (e₁, z)：P 为最低点，圆心 C 在 P 正上方 r 处</text>
  <text x="749" y="342" text-anchor="middle" font-size="9" fill="#64748b">r = mv⊥/(qB) = √(2E₁R/k)/B，k = q/m</text>

  <!-- ================================================================ -->
  <!-- CONSTRAINT SUMMARY (bottom section)                            -->
  <!-- ================================================================ -->
  <rect x="20" y="325" width="863" height="100" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="40" y="348" font-size="13" font-weight="bold" fill="#1e293b">约束条件与比荷范围</text>

  <!-- Constraint 1 -->
  <rect x="40" y="358" width="250" height="55" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="50" y="374" font-size="10" fill="#dc2626" font-weight="bold">约束 ①：到达收集板（z 方向）</text>
  <text x="50" y="390" font-size="9" fill="#1e293b">z_max = 2r ≥ L（最高点需 ≥ L）→ r ≥ L/2</text>

  <!-- Constraint 2 -->
  <rect x="320" y="358" width="250" height="55" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="330" y="374" font-size="10" fill="#dc2626" font-weight="bold">约束 ②：不越 y 侧壁</text>
  <text x="330" y="390" font-size="9" fill="#1e293b">y_max = L/2 + r/√2 ≤ L → r ≤ L/√2</text>

  <!-- Combined -->
  <rect x="600" y="358" width="270" height="55" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="735" y="374" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="bold">综合约束</text>
  <text x="735" y="390" text-anchor="middle" font-size="10" fill="#1e293b">L/2 ≤ r ≤ L/√2</text>
  <text x="735" y="406" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="bold">4E₁R/(B²L²) ≤ q/m ≤ 8E₁R/(B²L²)</text>

  <!-- ================================================================ -->
  <!-- KEY POINTS SECTION (bottom)                                    -->
  <!-- ================================================================ -->
  <rect x="20" y="435" width="863" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="456" font-size="12" font-weight="bold" fill="#1e293b">快速解题主线</text>

  <!-- Step 1 -->
  <circle cx="48" cy="476" r="10" fill="#2563eb"/>
  <text x="48" y="480" text-anchor="middle" font-size="10" fill="white" font-weight="bold">1</text>
  <text x="66" y="480" font-size="10" fill="#1e293b">区域 I：qE₁ = mv²/R → v² = (q/m)·E₁R</text>

  <!-- Step 2 -->
  <circle cx="48" cy="498" r="10" fill="#d97706"/>
  <text x="48" y="502" text-anchor="middle" font-size="10" fill="white" font-weight="bold">2</text>
  <text x="66" y="502" font-size="10" fill="#1e293b">区域 II：类平抛 y = ½(qE₂/m)(L/v)²，代入 v² 消去 q/m → y = E₂L²/(2E₁R) = L/2 → E₂ = E₁R/L</text>

  <!-- Step 3 -->
  <circle cx="48" cy="520" r="10" fill="#16a34a"/>
  <text x="48" y="524" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3</text>
  <text x="66" y="524" font-size="10" fill="#1e293b">区域 III：入口 v_x = v_y = √(qE₁R/m)，v⊥B → 纯圆周运动，P 为最低点</text>

  <!-- Step 4 -->
  <circle cx="320" cy="476" r="10" fill="#7c3aed"/>
  <text x="320" y="480" text-anchor="middle" font-size="10" fill="white" font-weight="bold">4</text>
  <text x="338" y="480" font-size="10" fill="#1e293b">r = √(2E₁R/k)/B，k = q/m。约束：L/2 ≤ r ≤ L/√2</text>
  <text x="338" y="498" font-size="10" fill="#1e293b">代入 r 表达式 → 4E₁R/(B²L²) ≤ k ≤ 8E₁R/(B²L²)</text>

  <!-- ================================================================ -->
  <!-- COORDINATE LEGEND                                               -->
  <!-- ================================================================ -->
  <rect x="20" y="540" width="863" height="30" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="559" font-size="9" fill="#475569">O′→[区域 I：辐向电场，F₁ = qE₁ = mv²/R]→O(0,0,0)→[区域 II：类平抛，E₂ 沿 +y，x=vt，y=½·(qE₂/m)·t²]→P(L,L/2,0)→[区域 III：B 沿 (−1,1,0)/√2，v⊥B，纯圆周运动]→收集板(z=L)</text>

  <!-- Footer -->
  <text x="450" y="575" text-anchor="middle" font-size="7" fill="#94a3b8">悟理 AI · 三区域复合场 · entry question-e56b48a68a30</text>

</svg>
