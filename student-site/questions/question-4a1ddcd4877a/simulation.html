<script>
(() => {
  const root=document.getElementById('piecewise-particle-3d');
  const model=JSON.parse(root.querySelector('#piecewise-particle-3d-model').textContent);
  const canvas=root.querySelector('#piecewise-3d-canvas'),ctx=canvas.getContext('2d');
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=d=>d*Math.PI/180;
  const add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,s)=>a.map(v=>v*s);
  const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),norm=a=>Math.hypot(...a);
  const unit=a=>{const n=norm(a)||1;return mul(a,1/n)};
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const lerp=(a,b,f)=>a.map((v,i)=>v+(b[i]-v)*f);
  const cases=model.event_model.cases||[],timeline=[...model.event_model.timeline].sort((a,b)=>a.order-b.order);

  const camera=model.simulation?.camera||{},center=camera.target||[0,0,0];
  let caseId=cases[0].id,progress=0,playing=false,lastTime=0,lastPause=-1,layer=model.simulation.default_layer||'trajectory';
  let duration=model.simulation.default_duration_seconds||30,yaw=rad(camera.yaw_deg??-38),pitch=rad(camera.pitch_deg??28),zoom=1;
  let drag=null,pointers=new Map();
  const byId=id=>root.querySelector(id),currentCase=()=>cases.find(c=>c.id===caseId)||cases[0];
  const segments=()=>allSegments.filter(s=>(s.case_ids||[]).includes(caseId));
  const eventTime=e=>typeof e.time==='object'?Number(e.time[caseId]??0):Number(e.time??0);
  const events=()=>timeline.filter(e=>!e.case_ids||(e.case_ids||[]).includes(caseId));
  const caseDuration=()=>Number(currentCase().duration||Math.max(...events().map(eventTime),1));
  function pathPoint(g,f){
    const kind=g.path_kind||'points',u=clamp(f,0,1);
    if(kind==='line')return lerp(g.start,g.end,u);
    if(kind==='quadratic'){const t=(g.duration??1)*u;return add(add(g.start,mul(g.velocity,t)),mul(g.acceleration,.5*t*t))}
    if(kind==='arc3d'){const a=rad(g.start_deg+(g.end_deg-g.start_deg)*u);return add(g.center,add(mul(g.basis_u,g.radius*Math.cos(a)),mul(g.basis_v,g.radius*Math.sin(a))))}
    if(kind==='helix'){const a=rad(g.start_deg+(g.end_deg-g.start_deg)*u);return add(add(g.center_start,mul(unit(g.axis),Number(g.advance||0)*u)),add(mul(g.basis_u,g.radius*Math.cos(a)),mul(g.basis_v,g.radius*Math.sin(a))))}
    const pts=g.points||[[0,0,0],[0,0,0]],x=u*(pts.length-1),i=Math.min(pts.length-2,Math.floor(x));return lerp(pts[i],pts[i+1],x-i);
  }
  function sample(g,n=64){return Array.from({length:n+1},(_,i)=>pathPoint(g,i/n))}
  function project(p,w,h){
    const q=sub(p,center),cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const x=cy*q[0]-sy*q[1],y=sy*q[0]+cy*q[1],z=q[2],yy=cp*y-sp*z,zz=sp*y+cp*z;
    const scale=Math.min(w,h)*.16*zoom/(camera.scale||1);
    return{x:w/2+x*scale,y:h/2-zz*scale,depth:yy};
  }
  function line3(points,color='#687383',width=1,dash=[]){
    if(points.length<2)return;const {w,h}=metrics(),q=points.map(p=>project(p,w,h));
    ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
  }
  function arrow3(a,b,color,label){
    const {w,h}=metrics(),p=project(a,w,h),q=project(b,w,h),ang=Math.atan2(q.y-p.y,q.x-p.x);
    ctx.save();ctx.strokeStyle=ctx.fillStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-9*Math.cos(ang-.45),q.y-9*Math.sin(ang-.45));ctx.lineTo(q.x-9*Math.cos(ang+.45),q.y-9*Math.sin(ang+.45));ctx.closePath();ctx.fill();
    if(label){ctx.font='600 12px system-ui';ctx.fillText(label,q.x+5,q.y-5)}ctx.restore();
  }
  function boxEdges(min,max){const p=[];for(const x of [min[0],max[0]])for(const y of [min[1],max[1]])for(const z of [min[2],max[2]])p.push([x,y,z]);return [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]].map(([a,b])=>[p[a],p[b]])}
  function drawRegion(region){
    const s=region.shape||{},color=region.color||'#6790b5';
    if(s.type==='box')for(const edge of boxEdges(s.min,s.max))line3(edge,color,1,[5,4]);
    else if(s.type==='plane'){line3([s.origin,add(s.origin,s.u),add(add(s.origin,s.u),s.v),add(s.origin,s.v),s.origin],color,1,[5,4])}
    else if(s.type==='wireframe')for(const edge of s.edges||[])line3(edge,color,1,[5,4]);
    else if(s.type==='cylinder'){
      const axis=unit(s.axis),helper=Math.abs(axis[2])<.9?[0,0,1]:[1,0,0],u=unit(cross(axis,helper)),v=unit(cross(axis,u)),half=Number(s.length)/2;
      for(const k of [-1,1]){const c=add(s.center,mul(axis,k*half));line3(Array.from({length:49},(_,i)=>add(c,add(mul(u,s.radius*Math.cos(i*Math.PI/24)),mul(v,s.radius*Math.sin(i*Math.PI/24))))),color,1,[5,4])}
      for(const a of [0,Math.PI/2,Math.PI,3*Math.PI/2]){const off=add(mul(u,s.radius*Math.cos(a)),mul(v,s.radius*Math.sin(a)));line3([add(add(s.center,mul(axis,-half)),off),add(add(s.center,mul(axis,half)),off)],color,1,[5,4])}
    }
    if(layer!=='trajectory'&&region.field?.direction){
      const o=region.field.origin||s.center||s.origin||s.min||[0,0,0],d=unit(region.field.direction),len=Number(region.field.arrow_length||1);
      arrow3(o,add(o,mul(d,len)),region.field.kind==='electric'?'#d58b20':'#356bb3',region.field.label||region.label);
    }
  }
  function metrics(){const w=Math.max(320,Math.round(canvas.getBoundingClientRect().width)),h=Math.round(w*10/16),d=devicePixelRatio||1;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}return{w,h}}
  function drawAxes(){const a=model.facts?.axes||{origin:[0,0,0],lengths:[2,2,2]},o=a.origin||[0,0,0],l=a.lengths||[2,2,2];arrow3(o,add(o,[l[0],0,0]),'#d45454','x');arrow3(o,add(o,[0,l[1],0]),'#40905a','y');arrow3(o,add(o,[0,0,l[2]]),'#4a70c5','z')}
  function draw(){
    const {w,h}=metrics();ctx.clearRect(0,0,w,h);ctx.fillStyle='#f8fbff';ctx.fillRect(0,0,w,h);
    drawAxes();for(const region of model.regions||[])drawRegion(region);
    const now=progress*caseDuration(),visible=[];
    for(const s of segments()){
      const t0=Number(s.kinematics.start_time),t1=Number(s.kinematics.end_time);if(now<t0)continue;
      const f=clamp((now-t0)/(t1-t0),0,1),pts=sample(s.geometry,64),cut=Math.max(1,Math.floor(f*64));
      line3(pts.slice(0,cut+1),s.color||particles.find(p=>p.id===s.particle_id)?.color||'#e33b34',3);
      visible.push({s,p:pathPoint(s.geometry,f),done:f>=1});
      if(layer==='geometry'&&s.geometry.center)line3([s.geometry.center,pathPoint(s.geometry,f)],'#8d99a6',1,[4,4]);
    }
    for(const item of visible){
      const p=project(item.p,w,h),particle=particles.find(x=>x.id===item.s.particle_id)||{};
      ctx.save();ctx.fillStyle=particle.color||item.s.color||'#e33b34';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(particle.sign||'•',p.x,p.y);ctx.restore();
    }
    const ev=events().filter(e=>eventTime(e)<=now+1e-8).at(-1)||events()[0],next=events().find(e=>eventTime(e)>now+1e-8);
    byId('#piecewise-3d-phase').textContent=ev?.phase||ev?.label||'准备';
    byId('#piecewise-3d-event').textContent=next?next.label:(ev?.label||'完成');
    byId('#piecewise-3d-result').textContent=currentCase().conclusion||'';
    byId('#piecewise-3d-progress-label').textContent=Math.round(progress*100)+'%';
    byId('#piecewise-3d-progress').value=Math.round(progress*1000);
  }
  function setPlaying(value){playing=value;byId('#piecewise-3d-play').textContent=playing?'暂停':'播放';if(playing){lastTime=performance.now();requestAnimationFrame(tick)}}
  function tick(now){if(!playing)return;const delta=(now-lastTime)/1000;lastTime=now;const before=progress*caseDuration();progress=clamp(progress+delta/duration,0,1);const after=progress*caseDuration();
    if(byId('#piecewise-3d-auto-pause').checked){const hit=events().find(e=>{const t=eventTime(e);return (model.simulation.pause_event_ids||[]).includes(e.id)&&t>before&&t<=after&&t!==lastPause});if(hit){progress=eventTime(hit)/caseDuration();lastPause=eventTime(hit);setPlaying(false)}}
    if(progress>=1)setPlaying(false);draw();if(playing)requestAnimationFrame(tick)}
  const select=byId('#piecewise-3d-case');for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.label||c.id;select.append(o)}
  select.onchange=()=>{caseId=select.value;progress=0;lastPause=-1;setPlaying(false);draw()};
  byId('#piecewise-3d-title').textContent=model.title;byId('#piecewise-3d-play').onclick=()=>setPlaying(!playing);byId('#piecewise-3d-replay').onclick=()=>{progress=0;lastPause=-1;setPlaying(false);draw()};
  byId('#piecewise-3d-progress').oninput=e=>{progress=Number(e.target.value)/1000;setPlaying(false);draw()};
  const durationInput=byId('#piecewise-3d-duration');durationInput.value=duration;byId('#piecewise-3d-duration-label').textContent=duration+' 秒';durationInput.oninput=e=>{duration=Number(e.target.value);byId('#piecewise-3d-duration-label').textContent=duration+' 秒'};
  root.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layer=b.dataset.layer;root.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('active',x===b));draw()});
  const views={iso:[-38,28],front:[0,0],top:[0,88]};root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{[yaw,pitch]=views[b.dataset.view].map(rad);draw()});
  byId('#piecewise-3d-previous').onclick=()=>{const now=progress*caseDuration(),list=events().map(eventTime).filter(t=>t<now-1e-7);progress=(list.at(-1)||0)/caseDuration();setPlaying(false);draw()};
  byId('#piecewise-3d-next').onclick=()=>{const now=progress*caseDuration(),t=events().map(eventTime).find(x=>x>now+1e-7)??caseDuration();progress=t/caseDuration();setPlaying(false);draw()};
  byId('#piecewise-3d-zoom-out').onclick=()=>{zoom=clamp(zoom*.85,.45,4);draw()};byId('#piecewise-3d-zoom-in').onclick=()=>{zoom=clamp(zoom*1.18,.45,4);draw()};byId('#piecewise-3d-fit').onclick=()=>{zoom=1;yaw=rad(camera.yaw_deg??-38);pitch=rad(camera.pitch_deg??28);draw()};
  canvas.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.12:.89),.45,4);draw()};
  canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY,yaw,pitch}};
  canvas.onpointermove=e=>{if(!pointers.has(e.pointerId)||!drag)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw=drag.yaw+(e.clientX-drag.x)*.008;pitch=clamp(drag.pitch-(e.clientY-drag.y)*.008,rad(-89),rad(89));draw()}};
  const end=e=>{pointers.delete(e.pointerId);drag=null};canvas.onpointerup=end;canvas.onpointercancel=end;
  const more=root.querySelector('.more-controls');if(window.matchMedia('(min-width:761px)').matches)more.open=true;
  new ResizeObserver(draw).observe(canvas);draw();
})();
</script>
