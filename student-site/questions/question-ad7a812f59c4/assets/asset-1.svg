<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">磁聚焦与磁扩束的轨迹和最小磁场区域</title>
  <desc id="desc">左图表示宽度为r0的平行粒子束在圆形磁场中会聚于O点。对任意入射点P，粒子轨道圆心C位于P正上方，PC与磁场圆的半径MO平行且相等，因此CO等于PM等于r0，轨道必过O。右图表示粒子从O点进入第二磁场后变成宽度为2r0的水平平行束，轨道半径为2r0；阴影表示由两个全等圆弓形组成的最小磁场区域。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
    <pattern id="crosses" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M7,7 l8,8 M15,7 l-8,8" stroke="#475569" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="960" height="520" rx="18" fill="#f8fafc"/>
  <text x="480" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">先聚焦，再反向扩束</text>
  <text x="480" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">轨迹示意（不按比例）；蓝线为粒子轨迹，橙色阴影为第二磁场的最小区域</text>

  <!-- 左：第一次磁聚焦 -->
  <rect x="28" y="86" width="410" height="340" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="233" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">① 圆形磁场：平行束会聚</text>
  <circle cx="260" cy="265" r="122" fill="url(#crosses)" fill-opacity="0.32" stroke="#334155" stroke-width="2.5"/>
  <text x="260" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">B₀ ⊗</text>
  <path d="M48 204 H138" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M48 265 H138" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M48 326 H138" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M138 204 Q196 204 260 143" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M138 265 Q199 265 260 143" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M138 326 Q201 326 260 143" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="260" cy="143" r="5.5" fill="#dc2626"/>
  <text x="275" y="139" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">O</text>
  <!-- 任取入射点P：PC与MO是同向等长的半径，故PMOC为平行四边形 -->
  <circle cx="154" cy="326" r="4.5" fill="#7c3aed"/>
  <text x="139" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">P</text>
  <circle cx="154" cy="204" r="4.5" fill="#7c3aed"/>
  <text x="137" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">C</text>
  <circle cx="260" cy="265" r="4.5" fill="#0f172a"/>
  <text x="272" y="286" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">M</text>
  <path d="M154 326 L154 204 L260 143 M154 326 L260 265" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="215" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7c3aed">CO = PM = r₀ → 轨道必过 O</text>
  <line x1="260" y1="265" x2="260" y2="143" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="276" y="211" font-family="Arial, sans-serif" font-size="17" fill="#dc2626">R₁ = r₀</text>
  <line x1="76" y1="204" x2="76" y2="326" stroke="#0f172a" stroke-width="1.7"/>
  <line x1="67" y1="204" x2="85" y2="204" stroke="#0f172a" stroke-width="1.7"/>
  <line x1="67" y1="326" x2="85" y2="326" stroke="#0f172a" stroke-width="1.7"/>
  <text x="61" y="271" text-anchor="end" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">束宽 r₀</text>

  <!-- 右：第二次扩束 -->
  <rect x="462" y="86" width="470" height="340" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="697" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">② 正方形区域：从 O 点扩成平行束</text>
  <rect x="510" y="143" width="300" height="244" fill="none" stroke="#334155" stroke-width="2.5"/>
  <circle cx="510" cy="265" r="5.5" fill="#dc2626"/>
  <text x="487" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626">O</text>

  <!-- 两块圆弓形包络 -->
  <path d="M510 265 A122 122 0 0 1 632 143 L510 143 Z" fill="#fb923c" fill-opacity="0.45" stroke="#ea580c" stroke-width="2"/>
  <path d="M510 265 A122 122 0 0 0 632 387 L510 387 Z" fill="#fb923c" fill-opacity="0.45" stroke="#ea580c" stroke-width="2"/>
  <text x="608" y="244" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">圆弓形</text>
  <text x="608" y="292" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">圆弓形</text>

  <!-- 代表性粒子轨迹与平行出射 -->
  <path d="M510 265 A122 122 0 0 1 632 143" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M510 265 A122 122 0 0 0 632 387" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M510 265 H632" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M632 143 H900" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M632 265 H900" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M632 387 H900" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="719" y="188" font-family="Arial, sans-serif" font-size="17" fill="#2563eb">R₂ = 2r₀</text>
  <text x="713" y="214" font-family="Arial, sans-serif" font-size="16" fill="#334155">B = B₀/2，方向 ⊗</text>
  <line x1="862" y1="143" x2="862" y2="387" stroke="#0f172a" stroke-width="1.7"/>
  <line x1="853" y1="143" x2="871" y2="143" stroke="#0f172a" stroke-width="1.7"/>
  <line x1="853" y1="387" x2="871" y2="387" stroke="#0f172a" stroke-width="1.7"/>
  <text x="882" y="271" font-family="Arial, sans-serif" font-size="17" fill="#0f172a">2r₀</text>

  <!-- 面积结论 -->
  <rect x="146" y="452" width="668" height="48" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="480" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a3412">最小面积 = 2 ×（90°扇形 − 直角三角形）= (π − 2)r₀² / 2</text>
</svg>
